<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img"
     aria-label="PuiKit — capability-based Python UI framework for terminal and GUI">
  <title>PuiKit — capability-based Python UI framework for terminal and GUI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a2b"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#01040a" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="300" rx="14"/>
    </clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#e6edf3" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#dots)"/>
    <ellipse cx="210" cy="152" rx="180" ry="100" fill="#2ea043" opacity="0.14" filter="url(#soft)"/>
    <ellipse cx="990" cy="152" rx="180" ry="100" fill="#388bfd" opacity="0.14" filter="url(#soft)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="13.5" fill="none" stroke="#30363d"/>

  <!-- TUI rendering: green-on-black terminal panel -->
  <g font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <rect x="68" y="64" width="284" height="174" fill="#010409" stroke="#21262d" filter="url(#drop)"/>
    <rect x="80" y="76" width="260" height="150" fill="none" stroke="#2ea043" stroke-width="2"/>
    <rect x="327" y="80" width="6" height="142" fill="#0f2b1a"/>
    <rect x="327" y="84" width="6" height="50" fill="#2ea043" opacity="0.65"/>
    <rect x="94" y="69" width="64" height="14" fill="#010409"/>
    <text x="102" y="81" font-size="15" fill="#56d364">files</text>
    <rect x="88" y="124" width="236" height="25" fill="#2ea043"/>
    <text x="96" y="115" font-size="17" fill="#56d364">docs/</text>
    <text x="96" y="142" font-size="17" fill="#04140a">examples/</text>
    <text x="96" y="169" font-size="17" fill="#3fb950">panel.py</text>
    <text x="96" y="196" font-size="17" fill="#3fb950">theme.py</text>
  </g>

  <!-- GUI rendering: native-style window -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="848" y="64" width="284" height="174" rx="10" fill="#ffffff" filter="url(#drop)"/>
    <path d="M848 98 V74 a10 10 0 0 1 10 -10 h264 a10 10 0 0 1 10 10 v24 z" fill="#eef1f4"/>
    <rect x="848" y="97" width="284" height="1" fill="#d8dee4"/>
    <circle cx="866" cy="81" r="5.5" fill="#ff5f57"/>
    <circle cx="884" cy="81" r="5.5" fill="#febc2e"/>
    <circle cx="902" cy="81" r="5.5" fill="#28c840"/>
    <text x="990" y="85.5" font-size="13" fill="#59636e" text-anchor="middle">files</text>
    <rect x="856" y="136" width="260" height="32" rx="6" fill="#0969da"/>
    <g transform="translate(866,113)">
      <path d="M0 3.5 A2 2 0 0 1 2 1.5 H6.5 L8.5 4 H16 A2 2 0 0 1 18 6 V11.5 A2 2 0 0 1 16 13.5 H2 A2 2 0 0 1 0 11.5 Z" fill="#54aeff"/>
    </g>
    <g transform="translate(866,145)">
      <path d="M0 3.5 A2 2 0 0 1 2 1.5 H6.5 L8.5 4 H16 A2 2 0 0 1 18 6 V11.5 A2 2 0 0 1 16 13.5 H2 A2 2 0 0 1 0 11.5 Z" fill="#ffffff"/>
    </g>
    <g transform="translate(868,176)">
      <rect width="13" height="16" rx="2" fill="#e6ebf0" stroke="#b6c0ca"/>
      <rect x="3" y="5" width="7" height="1.5" fill="#9aa4af"/>
      <rect x="3" y="8.5" width="7" height="1.5" fill="#9aa4af"/>
    </g>
    <g transform="translate(868,208)">
      <rect width="13" height="16" rx="2" fill="#e6ebf0" stroke="#b6c0ca"/>
      <rect x="3" y="5" width="7" height="1.5" fill="#9aa4af"/>
      <rect x="3" y="8.5" width="7" height="1.5" fill="#9aa4af"/>
    </g>
    <text x="894" y="125" font-size="15" fill="#1f2328">docs</text>
    <text x="894" y="157" font-size="15" font-weight="600" fill="#ffffff">examples</text>
    <text x="894" y="189" font-size="15" fill="#1f2328">panel.py</text>
    <text x="894" y="221" font-size="15" fill="#1f2328">theme.py</text>
    <rect x="1119" y="106" width="6" height="50" rx="3" fill="#cdd5dd"/>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="136" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#wm)">PuiKit</text>
    <text x="600" y="178" font-size="19" fill="#9aa4b2">Build once — run on terminal and GUI</text>
    <rect x="498" y="196" width="204" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="600" y="215" font-size="14.5" fill="#8b949e"
          font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"><tspan fill="#56d364">$</tspan> pip install puikit</text>
  </g>
</svg>
