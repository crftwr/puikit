[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "puikit"
version = "1.0.1"
description = "Capability-based Python UI framework with TUI and GUI backends"
readme = "README.md"
license = "MIT"
authors = [{ name = "craftware" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
]
dependencies = [
    # Pillow decodes/crops/scales images for the terminal inline-image protocols
    # (kitty / iTerm2 / sixel), so the curses (TUI) backend's ImageView draws
    # real pictures instead of the alt-glyph fallback. Terminal image support is
    # a cross-platform TUI feature (every platform's terminals), so it is an
    # unconditional base dep — not a backend/platform-gated one. The renderer
    # still soft-imports it (see _terminal_graphics.have_pillow) and degrades to
    # the alt glyph if it is somehow absent; the native GUI backends render
    # images themselves and do not use it.
    "pillow>=9",
    # numpy vectorizes WindowsBackend's WIC->D2D alpha premultiply (~12-14x
    # faster on large images; see _win32_native._premultiply_bgra). Only the
    # Windows native backend imports it, and _win32_native (raw WinDLL) loads
    # only on Windows, so the win32 marker keeps numpy off macOS/Linux base
    # installs, which would never touch it.
    "numpy>=1.21; sys_platform == 'win32'",
    # windows-curses backports the _curses C extension CPython omits on Windows,
    # so the curses (TUI) backend runs there out of the box. The marker keeps it
    # off macOS/Linux, which already ship _curses.
    "windows-curses>=2.4; sys_platform == 'win32'",
    # PyObjC powers the macOS native GUI backend. The darwin marker installs it
    # automatically on macOS, so `pip install puikit` yields a working native
    # window out of the box, and keeps it off other platforms (where it cannot
    # build and the macOS backend never loads). Symmetric with numpy above: a
    # native GUI backend's hard requirement, gated to the one platform that
    # uses it.
    #
    # PyObjC ships ONE DISTRIBUTION PER SYSTEM FRAMEWORK, and they do not imply
    # each other, so every framework the backend imports needs its own entry
    # here. Cocoa covers AppKit/Foundation/objc/PyObjCTools; Quartz covers
    # CoreGraphics/CoreImage/QuartzCore (CAMetalLayer). Neither pulls in Metal
    # or CoreText — those are separate wheels and were missing, which is why
    # the two below are listed explicitly.
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    # Metal renders the Shader background kind (backends/_metal.py). Its import
    # is soft (HAVE_METAL) so a machine without it reports the capability
    # unsupported rather than crashing — but that is a fallback for broken
    # installs, not the intended shape: shader backgrounds are an advertised
    # macOS feature, so the binding is a declared dependency. Same
    # soft-import-but-still-required reasoning as pillow above.
    "pyobjc-framework-Metal>=10; sys_platform == 'darwin'",
    # CoreText registers the bundled Noto fonts into the process font scope and
    # builds the CJK fallback cascade (macos_backend._ensure_bundled_fonts /
    # _with_cjk_cascade). Also soft-imported (_HAS_CORETEXT): without it the
    # backend silently falls back to whatever fonts the OS happens to have,
    # losing the render-the-same-on-any-machine guarantee the bundled fonts
    # exist to provide.
    "pyobjc-framework-CoreText>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.urls]
Homepage = "https://github.com/crftwr/puikit"
Repository = "https://github.com/crftwr/puikit"
Issues = "https://github.com/crftwr/puikit/issues"

[tool.setuptools.packages.find]
include = ["puikit*"]

[tool.setuptools.package-data]
# Bundled default fonts (Noto Sans / Noto Sans Mono — a designed-together
# superfamily whose mono and proportional faces share metrics, so the base unit
# fits both and text does not clip). Shipped so the GUI backends render the same
# on any machine without the fonts installed; OFL.txt is their SIL OFL license.
# The web backend also serves the client page assets (backends/web/*) from disk.
puikit = ["fonts/*.ttf", "fonts/*.otf", "fonts/*.txt", "backends/web/*.html", "backends/web/*.js", "backends/web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail-safe: no single test may hang forever. A bug that spins (e.g. a
# `while` that never advances its guard) would otherwise leave an orphaned
# Python process pegged at 100% CPU after the runner's own timeout kills only
# the shell. The signal method raises in the main thread between bytecodes, so
# it interrupts even a pure-Python busy loop and reports which test hung.
timeout = 60
timeout_method = "signal"
